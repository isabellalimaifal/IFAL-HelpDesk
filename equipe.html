<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>IFAL HelpDesk - Equipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./supabase-config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Top Bar -->

            <div class="flex items-center gap-4">
                <div class="bg-emerald-700 text-white px-4 py-2 rounded-lg font-bold text-lg">
                    IFAL HelpDesk

            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2" id="user-display">
                    <div class="w-10 h-10 bg-emerald-700 rounded-full flex items-center justify-center text-white font-semibold">
                        US
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-900">Usuário</p>
                        <p class="text-xs text-gray-500">Técnico</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex pt-16">
        <!-- Left Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 fixed left-0 top-16 bottom-0 overflow-y-auto">
            <nav class="p-4">
                <ul class="space-y-2">

                    <li>

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>

                            </svg>

                        </a>
                    </li>
                    <li>
                        <a href="/conhecimento" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                            </svg>
                            Base de Conhecimento
                        </a>
                    </li>
                    <li>
                        <a href="/equipe" class="flex items-center gap-3 px-4 py-3 bg-emerald-700 text-white rounded-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>

                    </li>
                    <li>
                        <a href="/relatorios" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                            Relatórios
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="logout()" class="flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                            Sair
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-6">
            <div class="max-w-6xl mx-auto">
                <h1 class="text-2xl font-bold text-gray-900 mb-2">Equipe de Suporte Técnico</h1>
                <p class="text-gray-600 mb-8">Conheça os técnicos responsáveis pelo suporte do IFAL.</p>

                <!-- Stats Overview -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">Técnicos Ativos</p>
                                <p class="text-3xl font-bold text-gray-900" id="tecnicos-ativos">0</p>
                            </div>
                            <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center">
                                <svg class="w-6 h-6 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">Chamados em Andamento</p>
                                <p class="text-3xl font-bold text-gray-900" id="chamados-andamento">0</p>
                            </div>
                            <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                <svg class="w-6 h-6 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">Disponibilidade</p>
                                <p class="text-3xl font-bold text-gray-900">85%</p>
                            </div>
                            <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                                <svg class="w-6 h-6 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Technicians Grid -->
                <div id="technicians-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Technician cards will be rendered here -->
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        // Load technicians on page load
        document.addEventListener('DOMContentLoaded', async () => {
            // Check authentication
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login';
                return;
            }

            // Load user info
            await loadUserInfo();

            await loadTechnicians();
        });

        // Logout function
        window.logout = async () => {
            await supabase.auth.signOut();
            window.location.href = '/login';
        };

        // Load user information
        async function loadUserInfo() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    const { data: usuario } = await supabase
                        .from('usuarios')
                        .select('nome, regra')
                        .eq('email', user.email)
                        .single();

                    const userDisplay = document.getElementById('user-display');
                    if (usuario) {
                        const initials = usuario.nome.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                        userDisplay.innerHTML = `
                            <div class="w-10 h-10 bg-emerald-700 rounded-full flex items-center justify-center text-white font-semibold">
                                ${initials}
                            </div>
                            <div>
                                <p class="text-sm font-medium text-gray-900">${usuario.nome}</p>
                                <p class="text-xs text-gray-500">${usuario.regra.charAt(0).toUpperCase() + usuario.regra.slice(1)}</p>
                            </div>
                        `;
                    }
                }
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Load technicians from database
        async function loadTechnicians() {
            try {
                // Fetch technicians from usuarios table
                const { data: usuarios, error } = await supabase
                    .from('usuarios')
                    .select('*')
                    .in('regra', ['tecnico', 'administrador']);

                if (error) throw error;

                const technicians = usuarios || [];
                
                // Update stats
                document.getElementById('tecnicos-ativos').textContent = technicians.length;

                // Fetch active tickets count
                const { count: activeTickets } = await supabase
                    .from('chamados')
                    .select('*', { count: 'exact', head: true })
                    .eq('status', 'Em progresso');

                document.getElementById('chamados-andamento').textContent = activeTickets || 0;

                // Render technician cards
                renderTechnicians(technicians);
            } catch (error) {
                console.error('Error loading technicians:', error);
                // Render mock data if database fails
                renderMockTechnicians();
            }
        }

        // Render technician cards
        async function renderTechnicians(technicians) {
            const grid = document.getElementById('technicians-grid');

            if (technicians.length === 0) {
                renderMockTechnicians();
                return;
            }

            // Fetch ticket count for each technician
            const techniciansWithStats = await Promise.all(
                technicians.map(async (tech) => {
                    const { count } = await supabase
                        .from('chamados')
                        .select('*', { count: 'exact', head: true })
                        .eq('tecnico_id', tech.id)
                        .eq('status', 'Em progresso');

                    return {
                        ...tech,
                        activeTickets: count || 0
                    };
                })
            );

            grid.innerHTML = techniciansWithStats.map(tech => `
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 hover:shadow-md transition-shadow">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-16 h-16 bg-emerald-700 rounded-full flex items-center justify-center text-white text-2xl font-bold flex-shrink-0">
                            ${tech.nome.charAt(0)}
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-900">${tech.nome}</h3>
                            <p class="text-sm text-gray-500">${getSpecialtyLabel(tech.email)}</p>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">Status</span>
                            <span class="flex items-center gap-1 text-sm text-green-600">
                                <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                                Online
                            </span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">Chamados Ativos</span>
                            <span class="text-sm font-semibold text-gray-900">${tech.activeTickets}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">Especialidade</span>
                            <span class="text-sm text-emerald-700 font-medium">${getSpecialty(tech.email)}</span>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <button class="w-full px-4 py-2 bg-emerald-700 text-white rounded-lg hover:bg-emerald-800 transition-colors text-sm font-medium">
                            Ver Perfil
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Render mock technicians if database is empty
        function renderMockTechnicians() {
            const mockTechnicians = [
                {
                    id: 1,
                    nome: 'Marcos Silva',
                    email: 'marcos@ifal.edu.br',
                    regra: 'tecnico',
                    activeTickets: 5,
                    specialty: 'Redes',
                    specialtyLabel: 'Especialista em Redes'
                },
                {
                    id: 2,
                    nome: 'Alessandra Costa',
                    email: 'alessandra@ifal.edu.br',
                    regra: 'tecnico',
                    activeTickets: 3,
                    specialty: 'Hardware',
                    specialtyLabel: 'Especialista em Hardware'
                },
                {
                    id: 3,
                    nome: 'Rafael Oliveira',
                    email: 'rafael@ifal.edu.br',
                    regra: 'tecnico',
                    activeTickets: 7,
                    specialty: 'Software',
                    specialtyLabel: 'Especialista em Software'
                },
                {
                    id: 4,
                    nome: 'Juliana Santos',
                    email: 'juliana@ifal.edu.br',
                    regra: 'administrador',
                    activeTickets: 2,
                    specialty: 'Geral',
                    specialtyLabel: 'Coordenadora de TI'
                },
                {
                    id: 5,
                    nome: 'Carlos Ferreira',
                    email: 'carlos@ifal.edu.br',
                    regra: 'tecnico',
                    activeTickets: 4,
                    specialty: 'Redes',
                    specialtyLabel: 'Especialista em Redes'
                },
                {
                    id: 6,
                    nome: 'Fernanda Lima',
                    email: 'fernanda@ifal.edu.br',
                    regra: 'tecnico',
                    activeTickets: 6,
                    specialty: 'Hardware',
                    specialtyLabel: 'Especialista em Hardware'
                }
            ];

            document.getElementById('tecnicos-ativos').textContent = mockTechnicians.length;
            document.getElementById('chamados-andamento').textContent = mockTechnicians.reduce((sum, tech) => sum + tech.activeTickets, 0);

            const grid = document.getElementById('technicians-grid');
            grid.innerHTML = mockTechnicians.map(tech => `
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 hover:shadow-md transition-shadow">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-16 h-16 bg-emerald-700 rounded-full flex items-center justify-center text-white text-2xl font-bold flex-shrink-0">
                            ${tech.nome.charAt(0)}
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-900">${tech.nome}</h3>
                            <p class="text-sm text-gray-500">${tech.specialtyLabel}</p>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">Status</span>
                            <span class="flex items-center gap-1 text-sm text-green-600">
                                <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                                Online
                            </span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">Chamados Ativos</span>
                            <span class="text-sm font-semibold text-gray-900">${tech.activeTickets}</span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">Especialidade</span>
                            <span class="text-sm text-emerald-700 font-medium">${tech.specialty}</span>
                        </div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <button class="w-full px-4 py-2 bg-emerald-700 text-white rounded-lg hover:bg-emerald-800 transition-colors text-sm font-medium">
                            Ver Perfil
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Get specialty based on email (mock logic)
        function getSpecialty(email) {
            const specialties = {
                'marcos': 'Redes',
                'alessandra': 'Hardware',
                'rafael': 'Software',
                'juliana': 'Geral',
                'carlos': 'Redes',
                'fernanda': 'Hardware'
            };
            const name = email.split('@')[0].toLowerCase();
            return specialties[name] || 'Geral';
        }

        // Get specialty label
        function getSpecialtyLabel(email) {
            const labels = {
                'Redes': 'Especialista em Redes',
                'Hardware': 'Especialista em Hardware',
                'Software': 'Especialista em Software',
                'Geral': 'Coordenador(a) de TI'
            };
            const specialty = getSpecialty(email);
            return labels[specialty] || 'Técnico de TI';
        }
    </script>
</body>
</html>
