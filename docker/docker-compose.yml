# Docker Compose para produção - IFAL-HelpDesk
# Configuração para rodar a aplicação Vite com Nginx

version: '3.8'

services:
  web:
    build:
      context: ..  # Contexto do build é o diretório pai (raiz do projeto)
      dockerfile: docker/Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: ifal-helpdesk-prod
    ports:
      - "8080:80"  # Mapeamento porta host:container (Nginx porta 80)
    restart: unless-stopped
