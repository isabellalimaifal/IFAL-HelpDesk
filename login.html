<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFAL HelpDesk - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./supabase-config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-6">
        <!-- Login Card -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
            <!-- Logo -->
            <div class="text-center mb-8">
                <div class="bg-emerald-700 text-white px-6 py-3 rounded-lg font-bold text-xl inline-block mb-4">
                    IFAL HelpDesk
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Bem-vindo de volta</h2>
                <p class="text-gray-500 mt-2">Faça login para acessar o sistema</p>
            </div>

            <!-- Error Alert -->
            <div id="error-alert" class="hidden mb-4 bg-red-50 border border-red-200 rounded-lg p-4">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <p id="error-message" class="text-sm text-red-700"></p>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="mb-6">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        E-mail Institucional
                    </label>
                    <input type="email" id="email" name="email" required
                           placeholder="seu.email@ifal.edu.br"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent">
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Senha
                    </label>
                    <input type="password" id="password" name="password" required
                           placeholder="••••••••"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent">
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="remember" class="w-4 h-4 text-emerald-700 rounded focus:ring-emerald-700">
                        <span class="text-sm text-gray-600">Lembrar-me</span>
                    </label>
                    <a href="#" class="text-sm text-emerald-700 hover:text-emerald-800">
                        Esqueceu a senha?
                    </a>
                </div>

                <button type="submit" class="w-full px-6 py-3 bg-emerald-700 text-white rounded-lg hover:bg-emerald-800 transition-colors font-semibold">
                    Entrar
                </button>
            </form>

            <!-- Registration Form (Hidden by default) -->
            <form id="register-form" class="hidden">
                <div class="mb-4">
                    <label for="reg-name" class="block text-sm font-medium text-gray-700 mb-2">
                        Nome Completo
                    </label>
                    <input type="text" id="reg-name" name="name" required
                           placeholder="Seu nome completo"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent">
                </div>

                <div class="mb-4">
                    <label for="reg-email" class="block text-sm font-medium text-gray-700 mb-2">
                        E-mail Institucional
                    </label>
                    <input type="email" id="reg-email" name="email" required
                           placeholder="seu.email@ifal.edu.br"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent">
                </div>

                <div class="mb-4">
                    <label for="reg-password" class="block text-sm font-medium text-gray-700 mb-2">
                        Senha
                    </label>
                    <input type="password" id="reg-password" name="password" required
                           placeholder="Mínimo 6 caracteres"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent">
                </div>

                <div class="mb-4">
                    <label for="reg-confirm-password" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirmar Senha
                    </label>
                    <input type="password" id="reg-confirm-password" name="confirm-password" required
                           placeholder="Confirme sua senha"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent">
                </div>

                <div class="mb-6">
                    <label for="reg-role" class="block text-sm font-medium text-gray-700 mb-2">
                        Tipo de Usuário
                    </label>
                    <select id="reg-role" name="role" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:border-transparent">
                        <option value="">Selecione...</option>
                        <option value="aluno">Aluno</option>
                        <option value="servidor">Servidor</option>
                        <option value="tecnico">Técnico</option>
                        <option value="administrador">Administrador</option>
                    </select>
                </div>

                <button type="submit" class="w-full px-6 py-3 bg-emerald-700 text-white rounded-lg hover:bg-emerald-800 transition-colors font-semibold">
                    Cadastrar
                </button>
            </form>

            <!-- Divider -->
            <div class="my-6 flex items-center">
                <div class="flex-1 border-t border-gray-200"></div>
                <span class="px-4 text-sm text-gray-500">ou</span>
                <div class="flex-1 border-t border-gray-200"></div>
            </div>

            <!-- Help Links -->
            <div class="text-center space-y-2">
                <p class="text-sm text-gray-600" id="toggle-text">
                    Não tem uma conta? 
                    <a href="#" onclick="toggleForm()" class="text-emerald-700 hover:text-emerald-800 font-medium">
                        Cadastrar-se
                    </a>
                </p>
                <p class="text-xs text-gray-400 mt-4">
                    Acesso restrito a e-mails institucionais do IFAL
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-sm text-gray-500">
            <p>© 2024 IFAL - Instituto Federal de Alagoas</p>
        </div>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        let isLoginMode = true;

        // Toggle between login and registration forms
        window.toggleForm = () => {
            isLoginMode = !isLoginMode;
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const toggleText = document.getElementById('toggle-text');
            const title = document.querySelector('h2');
            const subtitle = document.querySelector('p.text-gray-500');

            if (isLoginMode) {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                title.textContent = 'Bem-vindo de volta';
                subtitle.textContent = 'Faça login para acessar o sistema';
                toggleText.innerHTML = 'Não tem uma conta? <a href="#" onclick="toggleForm()" class="text-emerald-700 hover:text-emerald-800 font-medium">Cadastrar-se</a>';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                title.textContent = 'Criar nova conta';
                subtitle.textContent = 'Cadastre-se para acessar o sistema';
                toggleText.innerHTML = 'Já tem uma conta? <a href="#" onclick="toggleForm()" class="text-emerald-700 hover:text-emerald-800 font-medium">Fazer login</a>';
            }
        };

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.toLowerCase().trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');

            // Hide previous error
            errorAlert.classList.add('hidden');

            // Validate institutional email
            if (!email.endsWith('@ifal.edu.br') && !email.endsWith('@aluno.ifal.edu.br') && !email.endsWith('@tec.ifal.edu.br')) {
                errorMessage.textContent = 'Apenas e-mails institucionais do IFAL são permitidos!';
                errorAlert.classList.remove('hidden');
                return;
            }

            try {
                // Authenticate with Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Determine user type based on email domain
                // Fetch user role from usuarios table
                const { data: usuario, error: userError } = await supabase
                    .from('usuarios')
                    .select('regra')
                    .eq('email', email)
                    .single();

                // Determine user type - use database role if available, otherwise fallback to email domain
                let userType;
                if (usuario && usuario.regra) {
                    userType = usuario.regra;
                } else {
                    userType = email.endsWith('@tec.ifal.edu.br') ? 'tecnico' : 'aluno';
                }
                
                // Save user type and email in localStorage
                localStorage.setItem('userType', userType);
                localStorage.setItem('userEmail', email);

                // Redirect to dashboard on success
                window.location.href = '/dashboard';
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'Erro ao fazer login. Verifique suas credenciais.';
                errorAlert.classList.remove('hidden');
            }
        });

        // Registration form submission
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.toLowerCase().trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const role = document.getElementById('reg-role').value;
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');

            // Hide previous error
            errorAlert.classList.add('hidden');

            // Validate institutional email
            if (!email.endsWith('@ifal.edu.br') && !email.endsWith('@aluno.ifal.edu.br') && !email.endsWith('@tec.ifal.edu.br')) {
                errorMessage.textContent = 'Apenas e-mails institucionais do IFAL são permitidos!';
                errorAlert.classList.remove('hidden');
                return;
            }

            // Validate password match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'As senhas não coincidem!';
                errorAlert.classList.remove('hidden');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                errorMessage.textContent = 'A senha deve ter no mínimo 6 caracteres!';
                errorAlert.classList.remove('hidden');
                return;
            }

            try {
                // Register user with Supabase
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: name,
                            role: role
                        },
                        emailConfirm: false
                    }
                });

                if (error) throw error;

                // Insert user into usuarios table
                const { error: insertError } = await supabase
                    .from('usuarios')
                    .insert([
                        {
                            nome: name,
                            email: email,
                            regra: role
                        }
                    ]);

                if (insertError) {
                    console.error('Error inserting user:', insertError);
                    // Continue even if insert fails, auth was successful
                }

                alert('Cadastro realizado com sucesso! Faça login para continuar.');
                toggleForm();
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.textContent = error.message || 'Erro ao fazer cadastro. Tente novamente.';
                errorAlert.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
